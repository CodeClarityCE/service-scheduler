services:
  service-scheduler:
    build:
      context: ../../backend
      dockerfile: services/scheduler/.cloud/docker/Dockerfile
      target: plugin-dev
      args:
        - PLUGINNAME=scheduler
        - KIND=services
    image: codeclarityce/service-scheduler-dev:latest
    restart: always
    volumes:
      - ../../backend:/codeclarity
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - ../../.cloud/env/.env.dev